<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Citizen Dashboard</title><link rel="stylesheet" href="style.css"><script src="citizen.js" defer></script></head><body><header class="hero"><div class="container"><h1>Citizen Dashboard</h1><p id="welcome">Your RTI requests</p><button id="logoutButton">Logout</button></div></header><main class="container"><section class="panel"><h2>Submit an RTI Request</h2><form id="requestForm"><label for="subject">Subject</label><input id="subject" maxlength="255" required><label for="description">Description</label><textarea id="description" rows="5" maxlength="3000" required></textarea><button>Submit Request</button></form><p id="message" role="status"></p></section><section class="panel"><h2>My Requests</h2><div class="table-wrap"><table><thead><tr><th>Code</th><th>Subject</th><th>Submitted</th><th>Deadline</th><th>Status</th><th>Response</th></tr></thead><tbody id="myRequests"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></section></main></body></html>
