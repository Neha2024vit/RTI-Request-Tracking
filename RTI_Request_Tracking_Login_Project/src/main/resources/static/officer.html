<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Officer Dashboard</title><link rel="stylesheet" href="style.css"><script src="officer.js" defer></script></head><body><header class="hero"><div class="container"><h1>Officer Dashboard</h1><p>Manage all RTI requests.</p><button id="logoutButton">Logout</button></div></header><main class="container"><section class="stats-grid"><article class="stat-card"><span>Total</span><strong id="total">0</strong></article><article class="stat-card"><span>Pending</span><strong id="pending">0</strong></article><article class="stat-card"><span>Responded</span><strong id="responded">0</strong></article><article class="stat-card"><span>Overdue</span><strong id="overdue">0</strong></article><article class="stat-card"><span>Due within 7 days</span><strong id="dueSoon">0</strong></article></section><section class="panel"><div class="section-heading"><h2>All Requests</h2><button id="refreshButton">Refresh</button></div><p id="message"></p><div class="table-wrap"><table><thead><tr><th>Code</th><th>Citizen</th><th>Email</th><th>Subject</th><th>Deadline</th><th>Status</th><th>Update</th></tr></thead><tbody id="requests"></tbody></table></div></section></main></body></html>
