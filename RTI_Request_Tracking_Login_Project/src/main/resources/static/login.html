<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTI Portal Login</title><link rel="stylesheet" href="auth.css"><script src="auth.js" defer></script></head><body><main class="auth-card"><h1>RTI Citizen Portal</h1><p>Submit requests, track progress and monitor deadlines.</p><div class="tabs"><button type="button" id="showLogin">Login</button><button type="button" id="showRegister">Sign Up</button></div><form id="loginForm"><h2>Welcome back</h2><label for="loginEmail">Email</label><input id="loginEmail" type="email" required><label for="loginPassword">Password</label><input id="loginPassword" type="password" required><button>Login</button></form><form id="registerForm" hidden><h2>Create citizen account</h2><label for="fullName">Full name</label><input id="fullName" maxlength="150" required><label for="registerEmail">Email</label><input id="registerEmail" type="email" maxlength="150" required><label for="registerPassword">Password (8+ characters)</label><input id="registerPassword" type="password" minlength="8" maxlength="72" required><button>Create Account</button></form><p id="message" role="status"></p></main></body></html>
